# -- Deshabilitar Config Server y Eureka --
spring.config.import=optional:
spring.cloud.config.enabled=false
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# -- Base de datos H2 en memoria (reemplaza MySQL) --
spring.datasource.url=jdbc:h2:mem:userdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# -- Reducir logs para tests --
logging.level.root=WARN
logging.level.com.userservice=INFO
